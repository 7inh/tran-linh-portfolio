<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="50%" stop-color="#E9EEF3" stop-opacity="0.55"/>
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#C9D3DD" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EDF1F5"/>
      <stop offset="100%" stop-color="#CBD5E0"/>
    </linearGradient>
    <clipPath id="binInner">
      <path d="M 66 86 L 78 208 Q 79 218 90 218 L 166 218 Q 177 218 178 208 L 190 86 Z"/>
    </clipPath>
  </defs>

  <!-- Crumpled contents poking out of the bin -->
  <g>
    <circle cx="99" cy="72" r="19" fill="#4FC3F7"/>
    <circle cx="126" cy="61" r="21" fill="#FFCA28"/>
    <circle cx="154" cy="72" r="18" fill="#EF5A6F"/>
    <circle cx="139" cy="80" r="14" fill="#26C6DA"/>
    <circle cx="111" cy="82" r="13" fill="#AB7BE8"/>
  </g>

  <!-- Contents continuing below the rim, seen through the glass -->
  <g clip-path="url(#binInner)" opacity="0.55">
    <circle cx="104" cy="104" r="20" fill="#4FC3F7"/>
    <circle cx="146" cy="110" r="18" fill="#FFCA28"/>
    <circle cx="124" cy="126" r="17" fill="#EF5A6F"/>
  </g>

  <!-- Bin body -->
  <path d="M 66 86 L 78 208 Q 79 218 90 218 L 166 218 Q 177 218 178 208 L 190 86 Z" fill="url(#glass)"/>
  <path d="M 66 86 L 78 208 Q 79 218 90 218 L 166 218 Q 177 218 178 208 L 190 86 Z"
        fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.75"/>

  <!-- Vertical glass striping -->
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.4" clip-path="url(#binInner)">
    <line x1="92" y1="88" x2="98" y2="216"/>
    <line x1="128" y1="88" x2="128" y2="216"/>
    <line x1="164" y1="88" x2="158" y2="216"/>
  </g>

  <!-- Rim -->
  <ellipse cx="128" cy="86" rx="62" ry="15" fill="url(#rim)"/>
  <ellipse cx="128" cy="86" rx="52" ry="9" fill="#93A3B4" opacity="0.35"/>
</svg>
