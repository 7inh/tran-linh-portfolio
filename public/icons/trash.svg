<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Glass effect background gradient -->
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F4F8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#B3D9E8;stop-opacity:0.4" />
    </linearGradient>
    <radialGradient id="glassShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#glassGrad)"/>

  <!-- Glass shine/specular highlight -->
  <ellipse cx="70" cy="70" rx="90" ry="80" fill="url(#glassShine)"/>

  <!-- Frosted glass edge glow -->
  <rect x="0" y="0" width="256" height="256" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

  <!-- Wastebasket icon in pearl white -->
  <g fill="#F8FAFC">
    <!-- Basket body -->
    <path d="M 70 80 L 75 180 Q 75 200 95 200 L 161 200 Q 181 200 181 180 L 186 80 Z" fill="#F8FAFC"/>

    <!-- Basket rim -->
    <ellipse cx="128" cy="80" rx="60" ry="12" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Basket handle -->
    <path d="M 85 80 Q 128 40 171 80" fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>

    <!-- Basket weave pattern lines -->
    <line x1="90" y1="100" x2="90" y2="190" stroke="#E5E7EB" stroke-width="2" opacity="0.4"/>
    <line x1="110" y1="85" x2="105" y2="195" stroke="#E5E7EB" stroke-width="2" opacity="0.3"/>
    <line x1="146" y1="85" x2="151" y2="195" stroke="#E5E7EB" stroke-width="2" opacity="0.3"/>
    <line x1="166" y1="100" x2="166" y2="190" stroke="#E5E7EB" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Subtle drop shadow -->
  <ellipse cx="128" cy="210" rx="70" ry="12" fill="#000000" opacity="0.1"/>

  <!-- Faint refraction distortion effect -->
  <rect x="50" y="100" width="20" height="80" fill="#FFFFFF" opacity="0.08" rx="4"/>
</svg>