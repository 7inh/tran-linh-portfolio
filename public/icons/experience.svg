<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark gray background -->
  <defs>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A4A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A5A5A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#darkGrad)"/>

  <!-- Terminal prompt: > _ -->
  <g>
    <!-- Greater than sign -->
    <text x="85" y="140" font-size="72" font-family="monospace" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
      &gt;
    </text>

    <!-- Underscore/cursor -->
    <line x1="150" y1="130" x2="180" y2="130" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

    <!-- Subtle drop shadow under text -->
    <ellipse cx="128" cy="155" rx="50" ry="8" fill="#000000" opacity="0.15"/>
  </g>
</svg>