<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Green gradient background -->
  <defs>
    <linearGradient id="dinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86EFAC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#dinoGrad)"/>

  <!-- T-Rex dinosaur silhouette -->
  <g fill="#F8FAFC">
    <!-- Body -->
    <ellipse cx="128" cy="140" rx="45" ry="50"/>

    <!-- Head -->
    <ellipse cx="160" cy="100" rx="28" ry="35"/>

    <!-- Snout -->
    <ellipse cx="185" cy="95" rx="18" ry="20"/>

    <!-- Eye -->
    <circle cx="170" cy="90" r="5" fill="#16A34A"/>

    <!-- Teeth marks on snout -->
    <line x1="185" y1="105" x2="185" y2="115" stroke="#16A34A" stroke-width="2" opacity="0.6"/>

    <!-- Front arm -->
    <ellipse cx="110" cy="160" rx="12" ry="35" fill="#F8FAFC"/>

    <!-- Back leg (thick) -->
    <ellipse cx="140" cy="185" rx="18" ry="40" fill="#F8FAFC"/>

    <!-- Tail -->
    <path d="M 85 140 Q 50 120 40 80" stroke="#F8FAFC" stroke-width="20" fill="none" stroke-linecap="round"/>

    <!-- Claw on tail -->
    <line x1="45" y1="85" x2="30" y2="65" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Drop shadow -->
  <ellipse cx="128" cy="225" rx="65" ry="12" fill="#000000" opacity="0.12"/>
</svg>