    <circle cx="50" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="62" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="74" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="86" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="98" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="110" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="122" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="134" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="146" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="158" cy="72" r="2.6" fill="#E0BE45"/>
    <circle cx="170" cy="72" r="2.6" fill="#E0BE45"/>
