<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Green gradient background -->
  <defs>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86EFAC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#browserGrad)"/>

  <!-- Compass icon -->
  <g>
    <!-- Outer circle -->
    <circle cx="128" cy="128" r="55" fill="none" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Compass rose arms -->
    <line x1="128" y1="73" x2="128" y2="50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="183" y1="128" x2="206" y2="128" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="128" y1="183" x2="128" y2="206" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="73" y1="128" x2="50" y2="128" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Inner pointing needle (red) -->
    <line x1="128" y1="128" x2="128" y2="75" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Center dot -->
    <circle cx="128" cy="128" r="6" fill="#FFFFFF"/>
  </g>
</svg>