<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Light blue gradient background -->
  <defs>
    <linearGradient id="contactGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A9D0F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B9FD1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#contactGrad)"/>

  <!-- White envelope -->
  <g>
    <!-- Envelope body -->
    <rect x="50" y="70" width="156" height="100" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Envelope flap (triangle) -->
    <path d="M 50 70 L 128 120 L 206 70" fill="none" stroke="#D1D5DB" stroke-width="2" stroke-linejoin="round"/>

    <!-- Inner fold line -->
    <line x1="128" y1="120" x2="128" y2="170" stroke="#D1D5DB" stroke-width="1.5" opacity="0.5"/>

    <!-- Subtle drop shadow -->
    <ellipse cx="128" cy="178" rx="65" ry="10" fill="#000000" opacity="0.12"/>
  </g>
</svg>