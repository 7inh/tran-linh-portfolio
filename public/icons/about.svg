<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="256" height="256" fill="#FFFFFF"/>

  <!-- Colorful flower petals arranged in circle around center -->
  <!-- Each petal is an ellipse rotated around the center point (128, 128) -->

  <!-- Red petal (top) -->
  <ellipse cx="128" cy="80" rx="24" ry="45" fill="#EF4444"/>

  <!-- Orange petal (top-right) -->
  <ellipse cx="161" cy="95" rx="24" ry="45" fill="#F97316" transform="rotate(60 128 128)"/>

  <!-- Yellow petal (right) -->
  <ellipse cx="176" cy="128" rx="24" ry="45" fill="#FBBF24" transform="rotate(120 128 128)"/>

  <!-- Green petal (bottom-right) -->
  <ellipse cx="161" cy="161" rx="24" ry="45" fill="#4ADE80" transform="rotate(180 128 128)"/>

  <!-- Cyan petal (bottom-left) -->
  <ellipse cx="95" cy="161" rx="24" ry="45" fill="#22D3EE" transform="rotate(240 128 128)"/>

  <!-- Blue petal (left) -->
  <ellipse cx="80" cy="128" rx="24" ry="45" fill="#3B82F6" transform="rotate(300 128 128)"/>

  <!-- Purple petal (top-left, between red and orange) -->
  <ellipse cx="95" cy="95" rx="24" ry="45" fill="#A855F7" transform="rotate(30 128 128)"/>

  <!-- Magenta petal (between orange and yellow) -->
  <ellipse cx="161" cy="67" rx="24" ry="45" fill="#EC4899" transform="rotate(90 128 128)"/>

  <!-- Central white circle -->
  <circle cx="128" cy="128" r="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
</svg>