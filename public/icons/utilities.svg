<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="256" height="256" fill="#FFFFFF"/>

  <!-- Crossed tools (wrench and screwdriver) in gray -->
  <g transform="translate(128, 128)">
    <!-- Wrench (left side) -->
    <g fill="none" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- Wrench handle -->
      <path d="M -50 -30 L 0 -30 Q 20 -30 20 -10 L 20 10"/>
      <!-- Wrench head (circular) -->
      <circle cx="20" cy="0" r="18"/>
      <circle cx="20" cy="0" r="12"/>
    </g>

    <!-- Screwdriver (right side, rotated) -->
    <g fill="none" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90)">
      <!-- Screwdriver handle -->
      <path d="M -50 -30 L 0 -30 L 15 -15 L 15 15 L 0 30 L -50 30"/>
      <!-- Screwdriver tip (cross) -->
      <line x1="15" y1="-8" x2="15" y2="8"/>
      <line x1="8" y1="0" x2="22" y2="0"/>
    </g>
  </g>

  <!-- Drop shadow -->
  <ellipse cx="128" cy="220" rx="75" ry="12" fill="#000000" opacity="0.08"/>
</svg>