<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEFF2"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#tile)"/>

  <!-- D-pad arms: flat outer edge, apex meeting at the centre so the gaps
       between them read as an X. Controller button colours. -->
  <g stroke="#1A1A1A" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- up -->
    <path d="M 96 32 L 160 32 L 160 96 L 128 128 L 96 96 Z" fill="#F5C518"/>
    <!-- right -->
    <path d="M 224 96 L 224 160 L 160 160 L 128 128 L 160 96 Z" fill="#E5342B"/>
    <!-- down -->
    <path d="M 160 224 L 96 224 L 96 160 L 128 128 L 160 160 Z" fill="#2FA84F"/>
    <!-- left -->
    <path d="M 32 160 L 32 96 L 96 96 L 128 128 L 96 160 Z" fill="#2E7DE0"/>
  </g>
</svg>
