<svg xmlns="http://www.w3.org/2000/svg" viewBox="139 39 506 506">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#2FD3FF"/>
      <stop offset="55%" stop-color="#0082FF"/>
      <stop offset="100%" stop-color="#0051FF"/>
    </linearGradient>

    <!-- Yellow Gradient -->
    <linearGradient id="yellowGrad" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#FFEC00"/>
      <stop offset="60%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <!-- Vibrant Green Overlap Gradient -->
    <linearGradient id="vibrantGreenGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#72EC16"/>
      <stop offset="50%" stop-color="#2ED147"/>
      <stop offset="100%" stop-color="#00B050"/>
    </linearGradient>

    <!-- Purple Gradient -->
    <linearGradient id="purpleGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#9E3BFF"/>
      <stop offset="60%" stop-color="#8000FF"/>
      <stop offset="100%" stop-color="#6200EA"/>
    </linearGradient>

    <!-- Red / Pink Gradient -->
    <linearGradient id="redPinkGrad" x1="25%" y1="15%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="50%" stop-color="#FF1767"/>
      <stop offset="100%" stop-color="#E0007A"/>
    </linearGradient>

    <!-- Clip Path for Cyan Circle -->
    <clipPath id="cyanClip">
      <circle cx="340" cy="240" r="145"/>
    </clipPath>
  </defs>

  <!-- Background: covers the cropped viewBox, not just the original canvas -->
  <rect x="139" y="39" width="506" height="506" fill="#141416"/>

  <g>
    <!-- Cyan/Blue Base Circle -->
    <circle cx="340" cy="240" r="145" fill="url(#cyanBlueGrad)"/>

    <!-- Yellow Circle -->
    <circle cx="455" cy="215" r="130" fill="url(#yellowGrad)" opacity="0.88"/>

    <!-- Luminous Green Intersection (Clipped to Cyan Circle) -->
    <circle cx="455" cy="215" r="130" fill="url(#vibrantGreenGrad)" opacity="0.92" clip-path="url(#cyanClip)"/>

    <!-- Purple Circle -->
    <circle cx="355" cy="420" r="80" fill="url(#purpleGrad)" opacity="0.82"/>

    <!-- Red/Pink Circle -->
    <circle cx="465" cy="370" r="125" fill="url(#redPinkGrad)" opacity="0.88"/>
  </g>
</svg>
