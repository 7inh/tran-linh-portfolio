<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple to blue gradient background -->
  <defs>
    <linearGradient id="gamesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#gamesGrad)"/>

  <!-- Gamepad controller -->
  <g fill="#FFFFFF">
    <!-- Main body -->
    <path d="M 60 100 Q 40 100 40 120 L 40 170 Q 40 190 60 190 L 196 190 Q 216 190 216 170 L 216 120 Q 216 100 196 100 Z" fill="#FFFFFF"/>

    <!-- Left D-pad area -->
    <circle cx="75" cy="130" r="12" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <line x1="75" y1="121" x2="75" y2="139" stroke="#3B82F6" stroke-width="2"/>
    <line x1="66" y1="130" x2="84" y2="130" stroke="#3B82F6" stroke-width="2"/>

    <!-- Right buttons area (A, B, X, Y style) -->
    <circle cx="185" cy="115" r="8" fill="#EF4444" opacity="0.7"/>
    <circle cx="202" cy="130" r="8" fill="#22C55E" opacity="0.7"/>
    <circle cx="168" cy="130" r="8" fill="#3B82F6" opacity="0.7"/>
    <circle cx="185" cy="145" r="8" fill="#FBBF24" opacity="0.7"/>

    <!-- Center button area -->
    <rect x="110" y="145" width="36" height="18" rx="4" fill="#3B82F6" opacity="0.5"/>
  </g>

  <!-- Drop shadow -->
  <ellipse cx="128" cy="195" rx="70" ry="10" fill="#000000" opacity="0.15"/>
</svg>